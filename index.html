<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Froggy Jumps - Online Multiplayer</title>
    <!-- PeerJS Library untuk sambungan 2 telefon -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            background: #1e293b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #gameCanvas {
            width: 100%;
            height: 65%;
            background: #0284c7;
            display: block;
        }

        .controls-panel {
            height: 35%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 8px;
            border-top: 4px solid #38bdf8;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            border: 1px solid #334155;
        }

        .touch-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
            justify-content: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn-touch {
            flex: 1;
            padding: 14px 0;
            background: #334155;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
        }

        .btn-touch:active {
            background: #0284c7;
            transform: scale(0.95);
        }

        .btn-jump {
            background: #16a34a;
            width: 100%;
            padding: 14px 0;
            font-size: 1.1rem;
        }

        .btn-jump:active {
            background: #22c55e;
        }

        /* Menu Overlay */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 24px;
            text-align: center;
        }

        .btn-main {
            background: #16a34a;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
            width: 100%;
        }

        .btn-secondary { background: #2563eb; }
        .btn-warning { background: #d97706; }

        input.room-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #38bdf8;
            background: #0f172a;
            color: white;
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 2px;
            margin: 10px 0;
            outline: none;
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    <div class="controls-panel">
        <div class="hud">
            <span id="scoreP1" style="color:#4ade80">P1 (Hijau): 0 pt</span>
            <span id="timer" style="color:#fef08a">Masa: 30s</span>
            <span id="scoreP2" style="color:#f43f5e">P2 (Merah): 0 pt</span>
        </div>

        <div class="touch-grid">
            <div class="btn-group">
                <button class="btn-touch" id="btn-left">◄ KIRI</button>
                <button class="btn-touch" id="btn-right">KANAN ►</button>
            </div>
            <button class="btn-touch btn-jump" id="btn-jump">LOMPAT 🪲</button>
        </div>
    </div>

    <!-- Start / Online Menu Screen -->
    <div class="overlay" id="startScreen">
        <h1 style="color:#4ade80; margin-bottom:6px; font-size: 1.8rem;">FROGGY JUMPS</h1>
        <p style="font-size:0.85rem; color:#cbd5e1; margin-bottom:15px;">
            Sertai lawan dari telefon lain!<br>
            <strong>1 Syiling = 2 Mata</strong>
        </p>

        <button class="btn-main" onclick="startSolo()">Solo (Latihan)</button>
        <button class="btn-main btn-secondary" onclick="createRoom()">Bina Bilik (Pemain 1 / Host)</button>
        
        <div style="width:100%; margin-top:10px; border-top:1px solid #334155; padding-top:10px;">
            <input type="text" id="joinCodeInput" class="room-input" placeholder="Masukkan Kod Bilik" maxlength="4">
            <button class="btn-main btn-warning" onclick="joinRoom()">Sertai Bilik (Pemain 2)</button>
        </div>

        <div class="status-msg" id="statusText"></div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight * 0.65;
}
resizeCanvas();

// PeerJS Online Setup
let peer = null;
let conn = null;
let myRole = 'solo'; // 'host', 'client', 'solo'
let roomCode = '';

// Game State
let isGameRunning = false;
let timeLeft = 30;
let timerInterval = null;

class Frog {
    constructor(x, color) {
        this.startX = x;
        this.x = x;
        this.y = canvas.height - 40;
        this.radius = 16;
        this.color = color;
        this.vx = 0;
        this.vy = 0;
        this.isGrounded = false;
        this.score = 0;
    }

    reset() {
        this.x = this.startX;
        this.y = canvas.height - 40;
        this.vx = 0;
        this.vy = 0;
        this.score = 0;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(this.x - 6, this.y - 8, 4, 0, Math.PI * 2);
        ctx.arc(this.x + 6, this.y - 8, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x - 6, this.y - 8, 2, 0, Math.PI * 2);
        ctx.arc(this.x + 6, this.y - 8, 2, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.fill();
    }

    update(platforms, hazards) {
        this.vy += 0.65;
        this.x += this.vx;
        this.y += this.vy;

        if (this.x - this.radius < 0) this.x = this.radius;
        if (this.x + this.radius > canvas.width) this.x = canvas.width - this.radius;

        this.isGrounded = false;
        platforms.forEach(p => {
            if (
                this.x > p.x && 
                this.x < p.x + p.w &&
                this.y + this.radius >= p.y &&
                this.y + this.radius <= p.y + 14 &&
                this.vy >= 0
            ) {
                this.y = p.y - this.radius;
                this.vy = 0;
                this.isGrounded = true;
                if (p.speed) this.x += p.speed;
            }
        });

        hazards.forEach(h => {
            let dist = Math.hypot(this.x - h.x, this.y - h.y);
            if (dist < this.radius + h.radius) {
                if (this.score >= 2) this.score -= 2;
                this.vy = 4;
            }
        });

        if (this.y + this.radius >= canvas.height - 5) {
            this.y = canvas.height - 5 - this.radius;
            this.vy = 0;
            this.isGrounded = true;
        }
    }

    jump() {
        if (this.isGrounded) this.vy = -12.5;
    }
}

let coins = [];
let platforms = [];
let hazards = [];
let p1 = new Frog(canvas.width * 0.25, '#4ade80');
let p2 = new Frog(canvas.width * 0.75, '#f43f5e');

function initWorld() {
    platforms = [
        { x: canvas.width * 0.1, y: canvas.height * 0.8, w: 70, h: 10, speed: 1.5, minX: 10, maxX: canvas.width * 0.4 },
        { x: canvas.width * 0.55, y: canvas.height * 0.8, w: 70, h: 10, speed: -1.5, minX: canvas.width * 0.5, maxX: canvas.width - 80 },
        { x: canvas.width * 0.35, y: canvas.height * 0.58, w: 80, h: 10, speed: 0 },
        { x: canvas.width * 0.08, y: canvas.height * 0.36, w: 65, h: 10, speed: 2, minX: 10, maxX: canvas.width * 0.45 },
        { x: canvas.width * 0.6, y: canvas.height * 0.36, w: 65, h: 10, speed: -2, minX: canvas.width * 0.5, maxX: canvas.width - 75 },
        { x: canvas.width * 0.38, y: canvas.height * 0.18, w: 75, h: 10, speed: 0 }
    ];

    hazards = [
        { x: canvas.width * 0.2, y: canvas.height * 0.5, radius: 10 },
        { x: canvas.width * 0.8, y: canvas.height * 0.5, radius: 10 }
    ];

    spawnCoins();
}

function spawnCoins() {
    coins = [];
    for (let i = 0; i < 5; i++) {
        coins.push({
            x: Math.random() * (canvas.width - 50) + 25,
            y: Math.random() * (canvas.height - 120) + 30,
            radius: 8,
            collected: false
        });
    }
}

function updatePlatforms() {
    platforms.forEach(p => {
        if (p.speed) {
            p.x += p.speed;
            if (p.x <= p.minX || p.x >= p.maxX) p.speed *= -1;
        }
    });
}

function drawPlatforms() {
    platforms.forEach(p => {
        ctx.fillStyle = p.speed !== 0 ? '#38bdf8' : '#059669';
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.w, p.h, 4);
        ctx.fill();
    });
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(0, canvas.height - 10, canvas.width, 10);
}

function drawHazards() {
    hazards.forEach(h => {
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ef4444';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#991b1b';
        ctx.stroke();
    });
}

function drawCoins() {
    coins.forEach(c => {
        if (!c.collected) {
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#eab308';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fef08a';
            ctx.stroke();
        }
    });
}

function checkCoinCollection(frog) {
    coins.forEach(c => {
        if (!c.collected) {
            let dist = Math.hypot(frog.x - c.x, frog.y - c.y);
            if (dist < frog.radius + c.radius) {
                c.collected = true;
                frog.score += 2; // 1 Syiling = 2 Point
            }
        }
    });

    if (coins.every(c => c.collected)) spawnCoins();
}

// Kawalan Telefon Pemain
function bindTouch(btnId, onPress, onRelease) {
    const btn = document.getElementById(btnId);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
    btn.addEventListener('mousedown', onPress);
    btn.addEventListener('mouseup', onRelease);
}

function handleInput(action, state) {
    let targetFrog = (myRole === 'client') ? p2 : p1;
    
    if (action === 'left') targetFrog.vx = state ? -4.5 : 0;
    if (action === 'right') targetFrog.vx = state ? 4.5 : 0;
    if (action === 'jump' && state) targetFrog.jump();

    // Hantar data kawalan ke telefon sebelah
    if (conn && conn.open) {
        conn.send({ type: 'input', action: action, state: state, role: myRole });
    }
}

bindTouch('btn-left', () => handleInput('left', true), () => handleInput('left', false));
bindTouch('btn-right', () => handleInput('right', true), () => handleInput('right', false));
bindTouch('btn-jump', () => handleInput('jump', true), () => handleInput('jump', false));

// Sambungan Online PeerJS
function createRoom() {
    myRole = 'host';
    roomCode = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('statusText').innerText = `Menjana bilik... Kod: ${roomCode}`;

    peer = new Peer('froggy-' + roomCode);

    peer.on('open', () => {
        document.getElementById('statusText').innerHTML = `Kod Bilik Anda: <b style="font-size:1.3rem; color:#fef08a;">${roomCode}</b><br>Minta rakan anda masukkan kod ini!`;
    });

    peer.on('connection', (c) => {
        conn = c;
        setupConnection();
        document.getElementById('statusText').innerText = "Rakan telah menyertai! Permainan bermula...";
        setTimeout(() => startGame(), 1000);
    });
}

function joinRoom() {
    myRole = 'client';
    const code = document.getElementById('joinCodeInput').value.trim();
    if (code.length !== 4) {
        alert("Sila masukkan Kod Bilik 4 digit yang betul!");
        return;
    }

    document.getElementById('statusText').innerText = "Menghubungkan ke bilik...";
    peer = new Peer();

    peer.on('open', () => {
        conn = peer.connect('froggy-' + code);
        setupConnection();
    });
}

function setupConnection() {
    conn.on('open', () => {
        if (myRole === 'client') {
            document.getElementById('statusText').innerText = "Berjaya menyertai! Menunggu Host...";
        }
    });

    conn.on('data', (data) => {
        if (data.type === 'input') {
            let remoteFrog = (data.role === 'client') ? p2 : p1;
            if (data.action === 'left') remoteFrog.vx = data.state ? -4.5 : 0;
            if (data.action === 'right') remoteFrog.vx = data.state ? 4.5 : 0;
            if (data.action === 'jump' && data.state) remoteFrog.jump();
        }
        if (data.type === 'start') {
            startGame();
        }
        if (data.type === 'sync' && myRole === 'client') {
            // Pelanggan mengemaskini kedudukan dari Host
            p1.x = data.p1.x; p1.y = data.p1.y; p1.score = data.p1.score;
            p2.x = data.p2.x; p2.y = data.p2.y; p2.score = data.p2.score;
            coins = data.coins;
            timeLeft = data.timeLeft;
        }
    });
}

function startSolo() {
    myRole = 'solo';
    startGame();
}

function startGame() {
    p1.reset();
    p2.reset();
    document.getElementById('startScreen').style.display = 'none';

    initWorld();
    timeLeft = 30;
    isGameRunning = true;

    if (myRole === 'host' && conn) {
        conn.send({ type: 'start' });
    }

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (myRole !== 'client') {
            timeLeft--;
            if (timeLeft <= 0) endGame();
        }
    }, 1000);

    gameLoop();
}

function endGame() {
    isGameRunning = false;
    clearInterval(timerInterval);

    let msg = p1.score > p2.score ? "Pemain 1 (Hijau) Menang!" : 
              p2.score > p1.score ? "Pemain 2 (Merah) Menang!" : "Keputusan Seri!";

    let html = myRole === 'solo' ? `
        <h1 style="color:#38bdf8;">TAMAT MASA!</h1>
        <h2 style="color:#fef08a; margin: 12px 0;">Mata Anda: ${p1.score} pt</h2>
    ` : `
        <h1 style="color:#38bdf8;">PERMAINAN TAMAT</h1>
        <h2 style="color:#fef08a; margin: 12px 0;">${msg}</h2>
        <p>P1 (Hijau): ${p1.score} pt | P2 (Merah): ${p2.score} pt</p>
    `;

    document.getElementById('startScreen').innerHTML = html + `
        <button class="btn-main" onclick="location.reload()">Main Semula</button>
    `;
    document.getElementById('startScreen').style.display = 'flex';
}

function gameLoop() {
    if (!isGameRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    updatePlatforms();
    drawPlatforms();
    drawHazards();
    drawCoins();

    p1.update(platforms, hazards);
    checkCoinCollection(p1);
    p1.draw();

    if (myRole !== 'solo') {
        p2.update(platforms, hazards);
        checkCoinCollection(p2);
        p2.draw();
    }

    // Host menghantar data senkronisasi kepada Client
    if (myRole === 'host' && conn && conn.open) {
        conn.send({
            type: 'sync',
            p1: { x: p1.x, y: p1.y, score: p1.score },
            p2: { x: p2.x, y: p2.y, score: p2.score },
            coins: coins,
            timeLeft: timeLeft
        });
    }

    document.getElementById('scoreP1').innerText = `P1: ${p1.score} pt`;
    document.getElementById('scoreP2').innerText = myRole !== 'solo' ? `P2: ${p2.score} pt` : '';
    document.getElementById('timer').innerText = `Masa: ${timeLeft}s`;

    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
