<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Froggy Jumps - Mobile Multiplayer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #1e293b;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 840px;
            display: flex;
            flex-direction: column;
            background: #0f172a;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #gameCanvas {
            width: 100%;
            height: 60%;
            background: #0284c7;
            display: block;
        }

        /* Control Panel bagi Telefon */
        .controls-panel {
            height: 40%;
            background: #1e293b;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 8px;
            border-top: 4px solid #38bdf8;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #334155;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .touch-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex-grow: 1;
        }

        .player-control {
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 12px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .p1-box { border-color: #4ade80; }
        .p2-box { border-color: #f43f5e; }

        .player-title {
            font-size: 0.8rem;
            font-weight: bold;
        }

        .p1-title { color: #4ade80; }
        .p2-title { color: #f43f5e; }

        .btn-group {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .btn-touch {
            flex: 1;
            padding: 12px 0;
            background: #334155;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            active-background: #475569;
        }

        .btn-touch:active {
            background: #0284c7;
            transform: scale(0.95);
        }

        .btn-jump {
            background: #16a34a;
            width: 100%;
            padding: 8px 0;
            margin-top: 4px;
        }

        .btn-jump:active {
            background: #22c55e;
        }

        /* Overlay Menu */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        .btn-main {
            background: #16a34a;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            margin-top: 15px;
            cursor: pointer;
            width: 80%;
        }

        .btn-secondary {
            background: #2563eb;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    <div class="controls-panel">
        <div class="hud">
            <span id="scoreP1" style="color:#4ade80">P1 (Hijau): 0 pt</span>
            <span id="timer">Masa: 45s</span>
            <span id="scoreP2" style="color:#f43f5e">P2 (Merah): 0 pt</span>
        </div>

        <div class="touch-grid">
            <!-- Kawalan P1 -->
            <div class="player-control p1-box">
                <span class="player-title p1-title">Pemain 1</span>
                <div class="btn-group">
                    <button class="btn-touch" id="p1-left">◄</button>
                    <button class="btn-touch" id="p1-right">►</button>
                </div>
                <button class="btn-touch btn-jump" id="p1-jump">LOMPAT</button>
            </div>

            <!-- Kawalan P2 / Bot -->
            <div class="player-control p2-box">
                <span class="player-title p2-title" id="p2-label">Pemain 2 (Bot)</span>
                <div class="btn-group">
                    <button class="btn-touch" id="p2-left">◄</button>
                    <button class="btn-touch" id="p2-right">►</button>
                </div>
                <button class="btn-touch btn-jump" id="p2-jump" style="background:#e11d48">LOMPAT</button>
            </div>
        </div>
    </div>

    <!-- Start / Game Over Screen -->
    <div class="overlay" id="startScreen">
        <h1 style="color:#4ade80; margin-bottom:10px;">FROGGY JUMPS</h1>
        <p style="font-size:0.9rem; color:#cbd5e1; margin-bottom:20px;">
            Kutip syiling sebanyak mungkin!<br>
            <strong>1 Syiling = 2 Mata</strong>
        </p>
        <button class="btn-main" onclick="startGame('bot')">1 Pemain (Lawan Bot)</button>
        <button class="btn-main btn-secondary" onclick="startGame('pvp')">2 Pemain (Skrin Kongsi)</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight * 0.6;
}
resizeCanvas();

// Game State
let isGameRunning = false;
let gameMode = 'bot'; // 'bot' atau 'pvp'
let timeLeft = 45;
let timerInterval = null;

// Frog Object Class
class Frog {
    constructor(x, color, controls) {
        this.x = x;
        this.y = canvas.height - 40;
        this.radius = 18;
        this.color = color;
        this.vx = 0;
        this.vy = 0;
        this.isGrounded = false;
        this.score = 0;
        this.controls = controls;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // Mata Katak
        ctx.beginPath();
        ctx.arc(this.x - 7, this.y - 10, 5, 0, Math.PI * 2);
        ctx.arc(this.x + 7, this.y - 10, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x - 7, this.y - 10, 2, 0, Math.PI * 2);
        ctx.arc(this.x + 7, this.y - 10, 2, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.fill();
    }

    update(platforms) {
        this.vy += 0.5; // Graviti
        this.x += this.vx;
        this.y += this.vy;

        // Kawalan Sempadan Skrin
        if (this.x - this.radius < 0) this.x = this.radius;
        if (this.x + this.radius > canvas.width) this.x = canvas.width - this.radius;

        // Semakan Platform
        this.isGrounded = false;
        platforms.forEach(p => {
            if (
                this.x > p.x && 
                this.x < p.x + p.w &&
                this.y + this.radius >= p.y &&
                this.y + this.radius <= p.y + 12 &&
                this.vy >= 0
            ) {
                this.y = p.y - this.radius;
                this.vy = 0;
                this.isGrounded = true;
            }
        });

        // Dasar Kolam
        if (this.y + this.radius >= canvas.height - 10) {
            this.y = canvas.height - 10 - this.radius;
            this.vy = 0;
            this.isGrounded = true;
        }
    }

    jump() {
        if (this.isGrounded) {
            this.vy = -11;
        }
    }
}

// Coins & Platforms
let coins = [];
let platforms = [];
let p1, p2;

function initWorld() {
    platforms = [
        { x: canvas.width * 0.1, y: canvas.height * 0.75, w: 80, h: 12 },
        { x: canvas.width * 0.6, y: canvas.height * 0.75, w: 80, h: 12 },
        { x: canvas.width * 0.35, y: canvas.height * 0.5, w: 100, h: 12 },
        { x: canvas.width * 0.15, y: canvas.height * 0.28, w: 70, h: 12 },
        { x: canvas.width * 0.65, y: canvas.height * 0.28, w: 70, h: 12 }
    ];
    spawnCoins();
}

function spawnCoins() {
    coins = [];
    for (let i = 0; i < 6; i++) {
        coins.push({
            x: Math.random() * (canvas.width - 40) + 20,
            y: Math.random() * (canvas.height - 100) + 30,
            radius: 8,
            collected: false
        });
    }
}

function drawPlatforms() {
    ctx.fillStyle = '#059669';
    platforms.forEach(p => {
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.w, p.h, 6);
        ctx.fill();
    });

    // Air bawah
    ctx.fillStyle = '#0369a1';
    ctx.fillRect(0, canvas.height - 10, canvas.width, 10);
}

function drawCoins() {
    coins.forEach(c => {
        if (!c.collected) {
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#eab308';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fef08a';
            ctx.stroke();
        }
    });
}

function updateBot() {
    if (gameMode !== 'bot') return;

    // Cari syiling terdekat
    let activeCoins = coins.filter(c => !c.collected);
    if (activeCoins.length === 0) return;

    let target = activeCoins[0];
    if (p2.x < target.x - 5) p2.vx = 3;
    else if (p2.x > target.x + 5) p2.vx = -3;
    else p2.vx = 0;

    if (target.y < p2.y - 30 && p2.isGrounded) {
        p2.jump();
    }
}

function checkCoinCollection(frog) {
    coins.forEach(c => {
        if (!c.collected) {
            let dist = Math.hypot(frog.x - c.x, frog.y - c.y);
            if (dist < frog.radius + c.radius) {
                c.collected = true;
                frog.score += 2; // Setiap syiling = 2 Point
            }
        }
    });

    // Respawn syiling jika habis
    if (coins.every(c => c.collected)) {
        spawnCoins();
    }
}

// Setup Touch Controls
function bindTouch(btnId, onPress, onRelease) {
    const btn = document.getElementById(btnId);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
    btn.addEventListener('mousedown', onPress);
    btn.addEventListener('mouseup', onRelease);
}

// P1 Controls
bindTouch('p1-left', () => p1.vx = -4, () => p1.vx = 0);
bindTouch('p1-right', () => p1.vx = 4, () => p1.vx = 0);
bindTouch('p1-jump', () => p1.jump(), () => {});

// P2 Controls
bindTouch('p2-left', () => { if(gameMode==='pvp') p2.vx = -4; }, () => { if(gameMode==='pvp') p2.vx = 0; });
bindTouch('p2-right', () => { if(gameMode==='pvp') p2.vx = 4; }, () => { if(gameMode==='pvp') p2.vx = 0; });
bindTouch('p2-jump', () => { if(gameMode==='pvp') p2.jump(); }, () => {});

function startGame(mode) {
    gameMode = mode;
    p1 = new Frog(canvas.width * 0.3, '#4ade80');
    p2 = new Frog(canvas.width * 0.7, '#f43f5e');

    document.getElementById('p2-label').innerText = mode === 'bot' ? 'Pemain 2 (Bot)' : 'Pemain 2';
    document.getElementById('startScreen').style.display = 'none';

    initWorld();
    timeLeft = 45;
    isGameRunning = true;

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = `Masa: ${timeLeft}s`;
        if (timeLeft <= 0) endGame();
    }, 1000);

    gameLoop();
}

function endGame() {
    isGameRunning = false;
    clearInterval(timerInterval);
    let msg = p1.score > p2.score ? "Pemain 1 (Hijau) Menang!" : 
              p2.score > p1.score ? "Pemain 2 (Merah) Menang!" : "Keputusan Seri!";
    
    document.getElementById('startScreen').innerHTML = `
        <h1 style="color:#38bdf8;">TAMAT PERMAINAN</h1>
        <h2 style="color:#fef08a; margin: 15px 0;">${msg}</h2>
        <p>Skor P1: ${p1.score} pt | Skor P2: ${p2.score} pt</p>
        <button class="btn-main" onclick="location.reload()">Main Semula</button>
    `;
    document.getElementById('startScreen').style.display = 'flex';
}

function gameLoop() {
    if (!isGameRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawPlatforms();
    drawCoins();

    p1.update(platforms);
    p2.update(platforms);

    if (gameMode === 'bot') updateBot();

    checkCoinCollection(p1);
    checkCoinCollection(p2);

    p1.draw();
    p2.draw();

    document.getElementById('scoreP1').innerText = `P1: ${p1.score} pt`;
    document.getElementById('scoreP2').innerText = `P2: ${p2.score} pt`;

    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
